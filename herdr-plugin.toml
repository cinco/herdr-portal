id = "herdr-portal"
name = "HERDR Portal Global Board"
version = "1.3.0"
min_herdr_version = "0.7.0"
description = "Mission-control dashboard and status board for herdr: monitor every workspace / tab / pane agent in a live TUI kanban (keyboard and mouse friendly) or web big-screen, click a card to jump to that session, open a new tab / split pane straight from the board, reply to a waiting agent from the browser, rename panes / tabs / workspaces in place, reclaim idle panes, check this fork (cinco/herdr-portal) for a newer release and run the update (git pull --ff-only on the linked clone) in a real tab, and hand global disk cleanup to Mole (mo clean). Ctrl+B A opens the TUI board, Ctrl+B Shift+A opens the web big-screen; aggregated agent status across all workspaces / tabs / panes, mouse selection, N new tab, s/S new pane, E rename, X reclaim idle, U check for and install updates, d/D run mo clean for global disk cleanup."
platforms = ["macos", "linux"]

[[actions]]
id = "open-board"
title = "Open global board"
description = "Open the live agent kanban as a Herdr popup."
command = ["bash", "scripts/open-board.sh"]

[[actions]]
id = "open-web"
title = "Open web portal"
description = "Open the web dashboard in a Herdr popup."
command = ["bash", "scripts/open-web.sh"]

[[panes]]
id = "board"
title = "Board"
placement = "overlay"
command = ["python3", "board/tui.py"]
